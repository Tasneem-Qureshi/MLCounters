name: Build APK & Keepalive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs twice a week (Mon & Thu 03:00 UTC) to keep GitHub Actions active and refresh data
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep GitHub Actions schedule alive (prevent 60-day inactivity disabling)
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct origin/main 2>/dev/null || echo $(date +%s))
          now=$(date +%s)
          diff_days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $diff_days"
          if [ $diff_days -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLCounters-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ML Counters v1.0.0
          body: |
            ### 📱 ML Counters v1.0.0
            - Real-Time Screen Hero Detection (OpenCV, down to 35px)
            - Floating Overlay Service with draggable & collapsible UI
            - Official Counter Recommendations & 834 Matchup Pairs
            - Counter Item Builds for All Heroes
            - Hero Mastery Tracking & Role Filters
            - Full Material 3 Dark Gaming Theme
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
