name: Weekly Data Update & Keepalive

on:
  schedule:
    # Runs every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Prevent GitHub 60-day inactivity workflow disabling
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct origin/main 2>/dev/null || echo $(date +%s))
          now=$(date +%s)
          diff_days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $diff_days"
          if [ $diff_days -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate data integrity & update
        run: python3 scripts/update_data.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "ML Counters Bot"
          git config user.email "bot@mlcounters.app"
          git add -A
          git commit -m "chore: weekly data validation and manifest bump [$(date +'%Y-%m-%d')]"
          git push origin HEAD:main
