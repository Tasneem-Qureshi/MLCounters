name: Build APK & Keepalive

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs twice a week (Mon & Thu 03:00 UTC) to keep GitHub Actions active and refresh data
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep GitHub Actions schedule alive (prevent 60-day inactivity disabling)
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct origin/main 2>/dev/null || echo $(date +%s))
          now=$(date +%s)
          diff_days=$(( (now - last) / 86400 ))
          echo "Days since last commit: $diff_days"
          if [ $diff_days -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/MLHelper.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLHelper-apk
          path: app/build/outputs/apk/release/MLHelper.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: ML Helper v1.0.2 - Full 134-Hero Roster & Item Sync
          body: |
            ### 📱 ML Helper v1.0.2
            - **Complete 134-Hero Roster**: All Mobile Legends heroes populated from official ranked data with zero missing entries.
            - **Portraits & Item Icons**: Bundled local offline assets and live CDN / GitHub raw endpoints for all 134 heroes and 104 items.
            - **Exact Official Counter Data**: 1,601 ranked counter edges, 1,553 strong-against edges, and 1,094 item counter tips with detailed explanations.
            - **Dynamic Remote Sync**: In-app 'Refresh Data' (Pull-to-refresh & TopBar sync icon) syncs newest live data from GitHub without needing to update the APK.
            - **OpenCV Screen Recognition Engine**: Multi-scale template matching calibrated across all 134 champions down to 35px.
            - **Floating Gaming Overlay**: Live draft assistant with role filters, mastery tracking, and counter picks.
          files: app/build/outputs/apk/release/MLHelper.apk
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/MLHelper.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
